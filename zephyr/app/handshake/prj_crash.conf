# Crash diagnostics — merged by flash-zephyr.sh when CRASH_DEBUG=1.
# Canonical settings: docs/crash-reporting-roadmap.md
#
# IMPORTANT: do NOT use CONFIG_DEBUG_COREDUMP_BACKEND_FLASH_PARTITION here
# (flash write from the fatal path double-faults on ESP32-S3).
#
# Logging-backend coredump (#CD on USB) is useful for desk gdb but poisons RTC
# capture PC (records coredump_* instead of the fault) and can wedge on Invalid SP.
# Field/desk crash path: RTC breadcrumb + crash ring only — use esp_coredump.sh only
# when temporarily flipping these on for a known-good SP fault.
# CONFIG_DEBUG_COREDUMP is not set
# CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING is not set

CONFIG_STACK_SENTINEL=y
# Paint stacks 0xaa — thread analyzer high-water + smash forensics.
CONFIG_INIT_STACKS=y
# GCC stack-protector OFF for desk soak. v310–v312 DoubleException showed
# Invalid SP (0xffffff80) + LoadProhibited@0x2c; canary instrumentation on
# every IRAM I2C/SPI frame correlated with smash. Rely on STACK_SENTINEL +
# APP_STACK_RA_CHECK + ext-bus mutex instead.
# CONFIG_STACK_CANARIES is not set
# CONFIG_STACK_CANARIES_STRONG is not set
# CONFIG_STACK_CANARIES_ALL is not set
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y

# Soft task WDT — OFF on desk. False render-hb / feed_render Issues noise while
# OpenOCD hang-hunt is the primary desk tool. Stable OTA keeps TASK_WDT via
# prj_release.conf + CONFIG_APP_STALL_WATCHDOG=y.
# CONFIG_WATCHDOG is not set
# CONFIG_TASK_WDT is not set
# CONFIG_APP_STALL_WATCHDOG is not set

# Cheap RA canaries on hot paths (render flush / IMU tick) — see stack_ra_check.h.
CONFIG_APP_STACK_RA_CHECK=y

# Step 4 — debug-only crash inject + BIST (never enable in production images).
CONFIG_APP_CRASH_DEBUG=y

# Off for the render-fault hunt: IMMEDIATE LOG + >>func flood on BT/IMU paths
# amplified UART stalls that look like render death. Re-enable for bring-up.
# CONFIG_APP_FUNC_TRACE is not set

# Keep LOG_MODE_IMMEDIATE (prj.conf). DEFERRED (v266) soft-rebooted ~370ms into
# boot at power_manager with zero USB FATAL — k_sys_fatal_error_handler reboots
# before the deferred backend can flush. USB wedge: cut spam (gatt→DBG, no AUTO
# analyzer) rather than deferred until log-thread stack is proven.

# Desk: thread analyzer on demand — AUTO every 30s garbled USB under IMMEDIATE.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
# CONFIG_THREAD_ANALYZER_AUTO is not set
CONFIG_THREAD_ANALYZER_AUTO_STACK_SIZE=2560

# -Os puts locals in registers, so GDB watches show <optimized out>.
# CONFIG_DEBUG selects -Og. Slots are 3 MiB (16 MB flash) so this fits.
# -O0 still does not: it blows even a 3 MiB slot and changes the SPI/BT race.
CONFIG_DEBUG=y
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_FRAME_POINTER=y

# Espressif-style heap corruption / tracing + HAL asserts (see app Kconfig).
# Real allocator protection on Zephyr-ESP is SYS_HEAP_* (heap_caps → k_malloc).
CONFIG_HEAP_POISONING_COMPREHENSIVE=y
CONFIG_HEAP_TRACING_STANDALONE=y
CONFIG_HEAP_TRACING_STACK_DEPTH=8
# HEAP_ABORT_WHEN_ALLOCATION_FAILS needs esp_system_abort (not in Zephyr port).
CONFIG_HAL_ASSERTION_ENABLE=y
CONFIG_SYS_HEAP_HARDENING_FULL=y
CONFIG_ASSERT_ON_ERRORS=y
CONFIG_BT_ASSERT_PANIC=y

# Leave off until we need lock-contention evidence (UART cost + overhead):
#   CONFIG_TRACING=y + mutex tracing APIs / SystemView (see roadmap "Desk SMP").
# CONFIG_SCHED_CPU_MASK is debated for ESP32-S3 dual-core — do not enable here.
