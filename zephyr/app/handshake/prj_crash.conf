# Crash diagnostics — step 2: coredump (logging backend) + BLE export.
# Merged by flash-zephyr.sh when CRASH_DEBUG=1.
#
# IMPORTANT: do NOT use CONFIG_DEBUG_COREDUMP_BACKEND_FLASH_PARTITION here.
# That backend performs a synchronous flash write from *inside* the fatal
# exception handler (interrupts + cache disabled). On ESP32/ESP32-S3, any
# instruction fetch from flash-mapped code while the cache is disabled for
# that write reads garbage -> a second "illegal instruction" exception ->
# recursive fault storm (repeated "FATAL EXCEPTION ... EXCCAUSE 0" lines,
# sub-millisecond apart, in ttyACM0.log) that never resolves in software and
# only ends when the hardware TG0 watchdog fires a full TG0WDT_SYS_RST. This
# was the actual root cause behind the repeated reconnect-crash-reboot loop,
# not a stall/starvation issue in application code. The logging backend
# dumps registers via printk (no flash access) so a real fault stays a single
# clean report instead of cascading into a hard reset.
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y

CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y

# Step 3a — task WDT + HW fallback; panic → coredump → reboot.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_MIN_TIMEOUT=2000
CONFIG_TASK_WDT_CHANNELS=4

# Step 4 — debug-only crash inject + BIST (never enable in production images).
CONFIG_APP_CRASH_DEBUG=y
