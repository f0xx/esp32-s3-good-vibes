# Production overlay (merged when CRASH_DEBUG=0). Staging and stable both use this.
# CONFIG_APP_CRASH_DEBUG must stay y — it also gates MT200 and other field paths.
# -O2, no desk -Og. Flashed zephyr.bin has no DWARF either way.
# Panel SPI is 40 MHz via app/handshake/panel_40mhz.overlay (I2C stays 400 kHz).

CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_APP_CRASH_DEBUG=y
CONFIG_APP_PANEL_SPI_MHZ=40

CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
# Do NOT enable HW fallback on ESP32-S3. Zephyr's wdt_esp32 passes window.max
# (ms) straight into wdt_hal_config_stage() which expects MWDT ticks
# (ESP-IDF uses timeout_ms * (1000 / TICKS_PER_US)). The mistimed TG0 MWDT
# was the classic ~13.5s empty-PC task_wdt flood. Soft main/render channels
# still catch stalls while the kernel can run.
CONFIG_TASK_WDT_HW_FALLBACK=n
CONFIG_TASK_WDT_CHANNELS=4
CONFIG_APP_STALL_WATCHDOG=y

CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y

# No assert storms in the field (desk uses prj_crash.conf). Keep stack sentinel —
# render InstrFetch@0 after minutes often means a smashed return address.
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=n

# No logging/flash coredump — see prj_crash.conf. RTC capture + reboot only.
# CONFIG_DEBUG_COREDUMP is not set
