# Overrides boot/zephyr/socs/esp32s3_procpu.conf (unsigned + upgrade-only).
# BOOT_UPGRADE_ONLY is a choice — select scratch-swap instead of CONFIG_FOO=n.
# Strip board GPIO/regulator so ECDSA verify + swap fit ESP32-S3 MCUboot IRAM.
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
CONFIG_BOOT_SWAP_USING_SCRATCH=y
# Slot0 re-hash on every boot needs IRAM we don't have on ESP32-S3 MCUboot.
# Upgrade path still validates slot1 signature; OTA CDN + phone verify SHA256.
# Desk/CI emit SHA256SUMS of signed artifacts for audit.
CONFIG_BOOT_VALIDATE_SLOT0=n
# Let McUboot auto-size sector count for this flash layout (manual 512 is ignored
# when BOOT_MAX_IMG_SECTORS_AUTO=y and only produces a Kconfig warning).
CONFIG_MCUBOOT_LOG_LEVEL_OFF=y
CONFIG_INPUT=n
CONFIG_GPIO=n
CONFIG_REGULATOR=n
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
