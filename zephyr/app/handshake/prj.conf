# v313: Invalid SP smash during imu_poll — give main more room under BLE+I2C.
CONFIG_MAIN_STACK_SIZE=24576
# 4.x ESP WiFi/BT ADD_SIZE_* sum (~76 KiB) + board would exceed DRAM; keep the
# proven 64 KiB system heap (DMA/INTERNAL still forced to DRAM by the wifi
# dma-dram patch; net pkts can use SPIRAM via ESP32_WIFI_NET_ALLOC_SPIRAM).
# (IDF "prod" tip uses 48 KiB — we stay higher for dual stacks + display.)
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
# Prefer UI/sensor work over background net/BT completions (Zephyr default).
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-1
# ESP32 WiFi driver depends on !SMP (drivers/wifi/esp32/Kconfig.esp32). Do not
# enable CONFIG_SMP — it silently disables CONFIG_WIFI_ESP32.
# CONFIG_SMP is not set
CONFIG_MULTITHREADING=y
# Diagnostic: a stack overflow on Xtensa/ESP32 tends to manifest as a raw
# double-exception -> hardware TG0WDT_SYS_RST (no Zephyr fatal report, nothing
# in crash_ring — see vibro_capture.c/vibro_band_rms.c static-buffer fix for
# the specific bug this caught). Sentinel check adds a canary word so future
# overflows have a better chance of surfacing as a clean k_sys_fatal_error
# (captured by crash_report) instead of a silent hard reset.
# L1 interrupts were re-entering _handle_excint during the window spill
# and livelocking (frozen uptime, PC in xtensa_save_high_regs, garbage A0).
# Handlers must not preempt each other. 2 KiB ISR stack is too small for
# one ESP32 BT frame plus the spill.
CONFIG_XTENSA_INTERRUPT_NONPREEMPTABLE=y
CONFIG_ISR_STACK_SIZE=4096
CONFIG_STACK_SENTINEL=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_DISPLAY=y
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_I2C=y
CONFIG_PWM=y
# Zephyr ADC driver provides adc_lock/arbiter symbols for battery_adc_esp32.c HAL path.
# Keep &adc1 disabled in DTS — enabling it corrupts curve-fit reads (~9.2V bug).
CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_ESP32_TEMP=y

# WiFi STA is compiled in but stays down until BLE net scan/connect
# (network_manager ensure_wifi_up). radio_scheduler pauses IMU NOTIFY and
# stretches the phone BLE interval while scan/connect is in progress.
#
# --- ESP32-S3 WiFi + BLE coexistence (Zephyr 4.4 / HAL names) ---
# IDF "prod" snippets use CONFIG_BT_CTRL_PINNED_TO_CORE_* and
# CONFIG_ESP_WIFI_TASK_CORE_ID; under Zephyr those map to:
#   CONFIG_ESP32_BT_CTLR_PINNED_TO_CORE=<0|1>
#   CONFIG_ESP_WIFI_TASK_PINNED_TO_CORE_{0,1}
# CONFIG_ESP32_SW_COEXIST_ENABLE defaults y when BT_ESP32 && WIFI_ESP32
# (soc/espressif/common/Kconfig) — do not set the IDF-only
# CONFIG_ESP_COEX_SW_COEXIST_ENABLE name.
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_UDP=y
# App traffic is UDP (NTP) + DHCP. TCP/TLS/mbedtls for WiFi CDN self-OTA pushed
# dram0 to ~96% and hung field boards — keep off until SPIRAM-backed TLS lands.
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONTEXT_NET_PKT_POOL=y
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_SMP=y

# Net pkt/buf pools live in SPIRAM when ESP32_WIFI_NET_ALLOC_SPIRAM=y.
# Midway between old 6/12 (buffer starve) and IDF tip 16/32 (heavy).
CONFIG_NET_PKT_RX_COUNT=12
CONFIG_NET_PKT_TX_COUNT=12
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=24
CONFIG_NET_MAX_CONN=4
CONFIG_NET_MAX_CONTEXTS=6
# WiFi DMA buffers must stay in DRAM (see apply-esp32-wifi-dma-dram.sh).
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=4
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_STATIC_TX_BUFFER=y
CONFIG_ESP32_WIFI_STATIC_TX_BUFFER_NUM=4
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=24
CONFIG_ESP32_WIFI_AMPDU_TX_ENABLED=n
CONFIG_ESP32_WIFI_AMPDU_RX_ENABLED=n
CONFIG_ESP32_WIFI_ENABLE_WPA3_SAE=n
CONFIG_ESP32_WIFI_ENABLE_WPA3_OWE_STA=n
# IDF tip enables IRAM_OPT for WiFi preference; on this board IRAM fights the
# BT controller (v102 coex hunt). Prefer DRAM/Flash for WiFi lib code.
CONFIG_ESP32_WIFI_IRAM_OPT=n
CONFIG_ESP32_WIFI_RX_IRAM_OPT=n
# ESP_HEAP_MIN_EXTRAM_THRESHOLD removed in Zephyr 4.x. Keep WiFi OSI allocs on
# the system (DRAM) heap; MAC _malloc_internal is forced to DRAM by
# apply-esp32-wifi-dma-dram.sh (__real_k_malloc).
# CONFIG_ESP32_WIFI_CACHE_TX_BUFFER_NUM only applies with ESP_WIFI_HEAP_SPIRAM.
CONFIG_ESP_WIFI_HEAP_SYSTEM=y
# Separate radio tasks across the two S3 CPUs (Zephyr itself stays UP-only).
# IDF snippets often pin *both* to core 0; we actually split them.
CONFIG_ESP_WIFI_TASK_PINNED_TO_CORE_0=y
CONFIG_ESP32_BT_CTLR_PINNED_TO_CORE=1

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ESP32S3 IMU sim"
CONFIG_BT_DEVICE_NAME_DYNAMIC=n
# BT_MAX_CONN=3: peripheral link to phone + experimental central link to the
# MT200 bridge (mt200_bridge.c, CONFIG_APP_CRASH_DEBUG only) + headroom for a
# debug-tool peripheral link (e.g. laptop triggering the mt200_scan op over
# ble_crash_gatt) while still advertising (advertising itself reserves a
# connection object). BT_CENTRAL/BT_GATT_CLIENT/BT_OBSERVER are needed for
# that scan->connect->discover flow.
CONFIG_BT_MAX_CONN=3
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_PAIRED=0
CONFIG_BT_RX_STACK_SIZE=8192
CONFIG_BT_RECV_WORKQ_BT=y
# bt_tx_processor workqueue thread (NOT BT_HCI_TX_STACK): desk soak showed
# unused=8/1024 (99%) for hours before a silent USB/board freeze — same smash
# class as the old BT LW WQ@1400. This symbol has a Kconfig prompt.
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=2048
# BT_LONG_WQ_STACK_SIZE is hidden (no prompt) — forced to 3072 via
# platform/apply-bt-long-wq-stack.sh (Kconfig default patch), not here.
# Upstream Zephyr issue #92224 + desk: with BT_ECC=y the stock default is
# 1400 and thread_analyzer shows unused=28/1408 (98%) overnight — overflow
# there corrupts adjacent stacks (render Invalid SP / LoadProhibited@0).
# Forced to 3072 (4096 + desk -Og overflowed dram0 by ~856B).
# NOTE: tried disabling BT_AUTO_PHY_UPDATE/BT_AUTO_DATA_LEN_UPDATE/
# BT_GAP_AUTO_UPDATE_CONN_PARAMS/BT_GATT_CACHING (v100) — made things WORSE
# (new idle crashes on "wifi" thread with no connection at all). Reverted.

CONFIG_BT_L2CAP_TX_MTU=517
CONFIG_BT_BUF_ACL_RX_SIZE=517
CONFIG_BT_BUF_ACL_TX_SIZE=517
# Smaller host ACL pools — large RX/TX counts correlated with dual-role MSPI
# smash under desk GDB soak. Keep 517B MTU/DLE; cut buffer *count*.
# total ACL RX ≈ BT_MAX_CONN + 1 + EXTRA → aim ~6–7.
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=2
CONFIG_BT_BUF_ACL_TX_COUNT=6
CONFIG_BT_BUF_CMD_TX_COUNT=4
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=8

CONFIG_CBPRINTF_FP_SUPPORT=y

# PSRAM (8 MB octal): framebuffer in .ext_ram.bss frees internal DRAM for WiFi+BT.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_SIZE=8388608
CONFIG_ESP_SPIRAM_HEAP_SIZE=524288
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y

CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_GENERATE_CONFIRMED_IMAGE=y
# bootutil logs "Image index / Swap type" at INF on every mcuboot_swap_type()
# (STATUS JSON used to call that each poll). Cache + this keeps serial usable.
CONFIG_MCUBOOT_UTIL_LOG_LEVEL_WRN=y
# Keep in sync with zephyr/app/common/fw_version.h (flash/ci also pass -D from that header).
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.0.247"
# Progressive erase during BLE DATA writes resets this board (flash_area_erase
# with a live LE link → TG0WDT). Pre-erase slot1 while disconnected instead
# (ble_ota_gatt.c); stream_flash then only programs already-blank pages.
CONFIG_IMG_ERASE_PROGRESSIVELY=n
CONFIG_REBOOT=y
