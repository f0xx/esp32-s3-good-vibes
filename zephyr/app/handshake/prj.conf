CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=90112
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BUFFER_SIZE=512
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_DISPLAY=y
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_I2C=y
CONFIG_PWM=y
# Zephyr ADC driver provides adc_lock/arbiter symbols for battery_adc_esp32.c HAL path.
# Keep &adc1 disabled in DTS — enabling it corrupts curve-fit reads (~9.2V bug).
CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_ESP32_TEMP=y

# DIAGNOSTIC v102: WiFi fully disabled to test whether BT+WiFi coexistence is
# the source of connect-time crashes (btController/BT RX WQ) and the
# spontaneous idle "wifi" thread crash. Current priority stack (TIME sync,
# crash drain, IMU/verdict relay) all routes via BLE -> phone anyway.
CONFIG_WIFI=n
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONTEXT_NET_PKT_POOL=y
CONFIG_NET_PKT_RX_COUNT=2
CONFIG_NET_PKT_TX_COUNT=2
CONFIG_NET_BUF_RX_COUNT=4
CONFIG_NET_BUF_TX_COUNT=4
CONFIG_NET_MAX_CONN=2
CONFIG_NET_MAX_CONTEXTS=2
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=4
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_STATIC_TX_BUFFER=y
CONFIG_ESP32_WIFI_STATIC_TX_BUFFER_NUM=4
CONFIG_ESP32_WIFI_AMPDU_TX_ENABLED=n
CONFIG_ESP32_WIFI_AMPDU_RX_ENABLED=n
CONFIG_ESP32_WIFI_ENABLE_WPA3_SAE=n
CONFIG_ESP32_WIFI_ENABLE_WPA3_OWE_STA=n

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ESP32S3 IMU sim"
CONFIG_BT_DEVICE_NAME_DYNAMIC=n
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=0
CONFIG_BT_RX_STACK_SIZE=8192
CONFIG_BT_RECV_WORKQ_BT=y
# BT_LONG_WQ_STACK_SIZE is hidden (no prompt) — bumped via
# platform/apply-bt-long-wq-stack.sh (Kconfig default patch), not here.
# Upstream Zephyr issue #92224: default 1300 overflows when BT_GATT_CACHING=y —
# BT_LONG_WQ runs connection-time deferred HCI work; overflow corrupts adjacent
# memory (matches our connect-time crashes in unrelated threads).
# NOTE: tried disabling BT_AUTO_PHY_UPDATE/BT_AUTO_DATA_LEN_UPDATE/
# BT_GAP_AUTO_UPDATE_CONN_PARAMS/BT_GATT_CACHING (v100) — made things WORSE
# (new idle crashes on "wifi" thread with no connection at all). Reverted.

CONFIG_BT_L2CAP_TX_MTU=517
CONFIG_BT_BUF_ACL_RX_SIZE=517
CONFIG_BT_BUF_ACL_TX_SIZE=517
CONFIG_BT_BUF_ACL_RX_COUNT=6
CONFIG_BT_BUF_ACL_TX_COUNT=6

CONFIG_CBPRINTF_FP_SUPPORT=y

# PSRAM (8 MB octal): framebuffer in .ext_ram.bss frees internal DRAM for WiFi+BT.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_SIZE=8388608
CONFIG_ESP_SPIRAM_HEAP_SIZE=524288
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y

CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_REBOOT=y
