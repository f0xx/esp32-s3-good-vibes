# Good Vibes — upstream to artc0 IMU backend (Alpine VM).
# Install on monstro: /etc/nginx/good-vibes-upstream.conf
# Include from http {} in nginx.conf:
#   include /etc/nginx/good-vibes-upstream.conf;

upstream good_vibes_be {
	server artc0.intra.raptor.org:8080 max_fails=2 fail_timeout=10s;
	keepalive 8;
}

upstream good_vibes_grafana {
	server artc0.intra.raptor.org:3000 max_fails=2 fail_timeout=10s;
	keepalive 4;
}
